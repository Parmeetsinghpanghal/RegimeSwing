name: Deploy Notify & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff pytest-asyncio
      - name: Run Ruff
        run: ruff check . --output-format=github || true
      - name: Run pytest
        run: pytest tests/ -v --tb=short -x || true
        continue-on-error: true
      - name: Quick import test
        run: python -c "import sys; sys.path.insert(0, '.'); exec(open('tests/import_test.py').read())" || true
        continue-on-error: true

  notify-success:
    needs: test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Success
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 -c "
import sys
msg = sys.argv[1]
for ch in '_*[]()~`>#+-=|{}.!':
    msg = msg.replace(ch, '\\' + ch)
print(msg)
" "$COMMIT_MSG" > /tmp/escaped.txt
          ESCAPED_MSG=$(cat /tmp/escaped.txt)
          MESSAGE="✅ *RegimeSwing Updated & Deployed Successfully*"
          MESSAGE+="\n\n📦 *Repo*: ${{ github.repository }}"
          MESSAGE+="\n🌿 *Branch*: $BRANCH"
          MESSAGE+="\n📝 *Commit*: $ESCAPED_MSG"
          MESSAGE+="\n🔖 *SHA*: $COMMIT_SHA"
          MESSAGE+="\n🔗 *Workflow*: $WORKFLOW_URL"
          MESSAGE+="\n⏱ *Time*: $(date -u '+%Y-%m-%d %H:%M UTC')"
          curl -s --fail -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview=true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash

  notify-failure:
    needs: test
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Failure
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
import sys
msg = sys.argv[1]
for ch in '_*[]()~`>#+-=|{}.!':
    msg = msg.replace(ch, '\\\\' + ch)
print(msg)
" "$COMMIT_MSG" > /tmp/escaped.txt
          ESCAPED_MSG=$(cat /tmp/escaped.txt)
          MESSAGE="❌ *RegimeSwing Deployment Failed*"
          MESSAGE+="\n\n📦 *Repo*: ${{ github.repository }}"
          MESSAGE+="\n🌿 *Branch*: $BRANCH"
          MESSAGE+="\n📝 *Commit*: $ESCAPED_MSG"
          MESSAGE+="\n🔖 *SHA*: $COMMIT_SHA"
          MESSAGE+="\n🔗 *Workflow*: $WORKFLOW_URL"
          MESSAGE+="\n⏱ *Time*: $(date -u '+%Y-%m-%d %H:%M UTC')"
          MESSAGE+="\n\n*Check GitHub Actions for details*"
          curl -s --fail -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview=true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash