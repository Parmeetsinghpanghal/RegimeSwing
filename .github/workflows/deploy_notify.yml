name: Deploy Notify & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff
          pip install pytest-asyncio

      - name: Run Ruff (linting)
        run: |
          ruff check . --output-format=github || true

      - name: Run Ruff (formatting check)
        run: |
          ruff format . --check || true

      - name: Run pytest (smoke tests)
        run: |
          pytest tests/ -v --tb=short -x || true
        continue-on-error: true

      - name: Quick import test
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from data.fetcher import create_fetcher
              from indicators.technical import add_all_indicators
              from indicators.regime import RegimeDetector
              from strategies.swing import run_all_strategies
              from strategies.scoring import create_scorer
              from backtest import WalkForwardBacktester, BacktestConfig
              from papertrade import PaperTradingEngine
              print('✅ All imports successful')
          except Exception as e:
              import traceback
              print(f'❌ Import failed: {e}')
              traceback.print_exc()
          " || true
        continue-on-error: true

  notify-success:
    needs: test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Success Notification
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Use GitHub context vars instead of git commands (works with shallow checkout)
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Write Python escape script to file, then execute
          cat > /tmp/escape_md.py << 'PYEOF'
import sys
msg = sys.argv[1]
for ch in r'_*[]()~`>#+-=|{}.!':
    msg = msg.replace(ch, '\\' + ch)
print(msg)
PYEOF

          ESCAPED_MSG=$(python3 /tmp/escape_md.py "$COMMIT_MSG")

          MESSAGE="✅ *RegimeSwing Updated & Deployed Successfully*"
          MESSAGE+="\n\n📦 *Repo*: ${{ github.repository }}"
          MESSAGE+="\n🌿 *Branch*: $BRANCH"
          MESSAGE+="\n📝 *Commit*: $ESCAPED_MSG"
          MESSAGE+="\n🔖 *SHA*: $COMMIT_SHA"
          MESSAGE+="\n🔗 *Workflow*: $WORKFLOW_URL"
          MESSAGE+="\n⏱ *Time*: $(date -u '+%Y-%m-%d %H:%M UTC')"

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview=true

      - name: Log success
        run: |
          echo "✅ Deployment notification sent to Telegram"

  notify-failure:
    needs: test
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Failure Notification
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Use GitHub context vars instead of git commands (works with shallow checkout)
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Escape MarkdownV2 special characters using temp Python file
          python3 -c "
import sys
msg = sys.argv[1]
for ch in r'_*[]()~`>#+-=|{}.!':
    msg = msg.replace(ch, '\\\\' + ch)
print(msg)
" "$COMMIT_MSG" > /tmp/escaped_msg.txt
          ESCAPED_MSG=$(cat /tmp/escaped_msg.txt)

          MESSAGE="❌ *RegimeSwing Deployment Failed*"
          MESSAGE+="\n\n📦 *Repo*: ${{ github.repository }}"
          MESSAGE+="\n🌿 *Branch*: $BRANCH"
          MESSAGE+="\n📝 *Commit*: $ESCAPED_MSG"
          MESSAGE+="\n🔖 *SHA*: $COMMIT_SHA"
          MESSAGE+="\n🔗 *Workflow*: $WORKFLOW_URL"
          MESSAGE+="\n⏱ *Time*: $(date -u '+%Y-%m-%d %H:%M UTC')"
          MESSAGE+="\n\n*Check GitHub Actions for details*"

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview=true

      - name: Log failure
        run: |
          echo "❌ Deployment failure notification sent to Telegram"