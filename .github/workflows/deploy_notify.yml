name: Deploy Notify & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff pytest-asyncio
      - name: Run Ruff
        run: ruff check . --output-format=github || true
      - name: Run pytest
        run: pytest tests/ -v --tb=short -x || true
        continue-on-error: true
      - name: Quick import test
        run: |
          python -c "
import sys
sys.path.insert(0, '.')
try:
    from data.fetcher import create_fetcher
    from indicators.technical import add_all_indicators
    from indicators.regime import RegimeDetector
    from strategies.swing import run_all_strategies
    from strategies.scoring import create_scorer
    from backtest import WalkForwardBacktester, BacktestConfig
    from papertrade import PaperTradingEngine
    print('All imports successful')
except Exception as e:
    import traceback
    print(f'Import failed: {e}')
    traceback.print_exc()
" || true
        continue-on-error: true

  notify-success:
    needs: test
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Success
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        uses: actions/github-script@v7
        with:
          script: |
            const commitMsg = '${{ github.event.head_commit.message }}';
            const commitSha = '${{ github.sha }}';
            const branch = '${{ github.ref_name }}';
            const workflowUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            // Escape MarkdownV2 special characters
            const escapeMd = (msg) => {
              return msg.replace(/[_*[\]()~`>#+-=|{}.!]/g, ch => '\\' + ch);
            };

            const escapedMsg = escapeMd(process.env.COMMIT_MSG);
            const message = `✅ *RegimeSwing Updated & Deployed Successfully*\n\n📦 *Repo*: ${{ github.repository }}\n🌿 *Branch*: ${branch}\n📝 *Commit*: ${escapedMsg}\n🔖 *SHA*: ${process.env.COMMIT_SHA}\n🔗 *Workflow*: ${process.env.WORKFLOW_URL}\n⏱ *Time*: ${new Date().toISOString().replace('T', ' ').replace('Z', ' UTC')}`;

            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            const url = `https://api.telegram.org/bot${token}/sendMessage`;

            await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: chatId,
                text: message,
                parse_mode: 'MarkdownV2',
                disable_web_page_preview: true
              })
            });
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  notify-failure:
    needs: test
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Failure
        uses: actions/github-script@v7
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const commitMsg = '${{ github.event.head_commit.message }}';
            const commitSha = '${{ github.sha }}';
            const branch = '${{ github.ref_name }}';
            const workflowUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';

            // Escape MarkdownV2 special characters
            const escapeMd = (msg) => {
              return msg.replace(/[_*[\]()~`>#+-=|{}.!]/g, ch => '\\' + ch);
            };

            const escapedMsg = escapeMd(process.env.COMMIT_MSG);
            const message = `❌ *RegimeSwing Deployment Failed*\n\n📦 *Repo*: ${{ github.repository }}\n🌿 *Branch*: ${branch}\n📝 *Commit*: ${process.env.COMMIT_MSG}\n🔖 *SHA*: ${process.env.COMMIT_SHA}\n🔗 *Workflow*: ${process.env.WORKFLOW_URL}\n⏱ *Time*: ${new Date().toISOString().replace('T', ' ').replace('Z', ' UTC')}\n\n*Check GitHub Actions for details*`;

            const token = process.env.TELEGRAM_BOT_TOKEN;
            const chatId = process.env.TELEGRAM_CHAT_ID;
            const url = `https://api.telegram.org/bot${token}/sendMessage`;

            await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: chatId,
                text: message,
                parse_mode: 'MarkdownV2',
                disable_web_page_preview: true
              })
            });
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}