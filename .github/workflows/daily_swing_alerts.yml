name: Daily Swing Alerts (3:45 PM IST)

on:
  schedule:
    # Runs Monday-Friday at 10:15 UTC = 3:45 PM IST
    - cron: '15 10 * * 1-5'
  workflow_dispatch:  # Manual trigger
    inputs:
      top_n:
        description: 'Number of top alerts to send'
        required: false
        default: '5'
        type: string
      min_score:
        description: 'Minimum score threshold (0-100)'
        required: false
        default: '60'
        type: string
      dry_run:
        description: 'Print message without sending to Telegram'
        required: false
        default: 'false'
        type: boolean

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run Swing Alert Generator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m alerts.scanner_alert \
            --top-n ${{ github.event.inputs.top_n || '5' }} \
            --min-score ${{ github.event.inputs.min_score || '60' }} \
            ${{ github.event.inputs.dry_run && '--dry-run' || '' }}

      - name: Upload alerts database as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-db
          path: logs/alerts_sent.db
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Swing Alerts Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/alerts_sent.db ]; then
            echo "- **Database**: ✅ Created" >> $GITHUB_STEP_SUMMARY
            sqlite3 logs/alerts_sent.db "SELECT COUNT(*) as total FROM alerts_sent;" | \
              sed 's/^/- **Total Alerts Stored**: /' >> $GITHUB_STEP_SUMMARY
            sqlite3 logs/alerts_sent.db "SELECT COUNT(*) as today FROM alerts_sent WHERE date = date('now');" | \
              sed 's/^/- **Today\'s Alerts**: /' >> $GITHUB_STEP_SUMMARY
          fi