name: Daily Swing Alerts (3:45 PM IST)

on:
  schedule:
    # Runs Monday-Friday at 10:15 UTC = 3:45 PM IST
    - cron: '15 10 * * 1-5'
  workflow_dispatch:  # Manual trigger

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Run alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m alerts.scanner_alert --top-n 5 --min-score 60

      - name: Upload alerts database as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-db
          path: logs/alerts_sent.db
          retention-days: 30

  notify-failure:
    needs: test
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Failure Notification
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          WORKFLOW_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MESSAGE="❌ *RegimeSwing Deployment Failed*"
          MESSAGE+="\n\n📦 *Repo*: ${{ github.repository }}"
          MESSAGE+="\n🌿 *Branch*: $BRANCH"
          MESSAGE+="\n📝 *Commit*: $COMMIT_MSG"
          MESSAGE+="\n🔖 *SHA*: $COMMIT_SHA"
          MESSAGE+="\n🔗 *Workflow*: $WORKFLOW_URL"
          MESSAGE+="\n⏱ *Time*: $(date -u '+%Y-%m-%d %H:%M UTC')"
          MESSAGE+="\n\n_Check GitHub Actions for details_"

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview=true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}